{% extends "base.html" %}

{% block content %}

<div class="card">

<h2>Cadastrar Usuário</h2>

<form method="POST">

<input name="nome"
placeholder="Nome" required>

<input name="sobrenome"
placeholder="Sobrenome" required>

<input name="cpf"
placeholder="CPF" required>

<input name="telefone"
placeholder="Telefone" required>

<button>Cadastrar</button>

</form>

</div>

<div class="card">

<h2>Usuários cadastrados</h2>

{% for u in usuarios %}

<p>
👤 {{u.nome}} {{u.sobrenome}}
| CPF: {{u.cpf}}
| Tel: {{u.telefone}}
</p>

{% endfor %}

</div>

{% endblock %}
